[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-platform"
version = "0.1.0"
description = "AI-assisted financial reconciliation platform. Deterministic accounting logic first."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0.29",
    "alembic>=1.13",
    "psycopg[binary]>=3.1; platform_system != 'Emscripten'",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "celery>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*", "workers*"]
exclude = ["apps.web*", "tests*", "infra*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:packages.*"]
markers = [
    "performance: bounded performance and complexity regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = "(apps/web|migrations/versions)"
warn_unused_ignores = false
disallow_untyped_decorators = false
