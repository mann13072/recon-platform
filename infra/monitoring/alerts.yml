# Generated by scripts/generate_monitoring_config.py; do not edit by hand.
groups:
  - name: reconciliation-platform
    rules:
      - alert: false_automatic_matches
        expr: false_automatic_match_rate > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Has the platform automatically matched something incorrectly?"
          threshold: "any confirmed false automatic match"
          first_action: "Raise the affected reconciliation's auto-match threshold to stop further automation, then find which rule produced the false match and lower its precision estimate."
          runbook: "docs/runbooks/reconciliation-job-failure.md"
      - alert: audit_chain_broken
        expr: audit_chain_verified < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Has anyone altered a historical audit event?"
          threshold: "audit chain verification failed for any tenant"
          first_action: "Follow the security incident runbook. Do not deploy."
          runbook: "docs/runbooks/security-incident.md"
      - alert: candidate_explosion
        expr: candidate_explosion_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Has a blocking key stopped discriminating?"
          threshold: "any run exceeding the expected candidates per row"
          first_action: "Check whether a source has started sending the same reference on every row. Runs get slower and suggestions get noisier."
          runbook: "docs/runbooks/reconciliation-job-failure.md"
      - alert: connector_unhealthy
        expr: connector_sync_success_rate < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Is a reconciliation about to run on stale data?"
          threshold: "under 90% of syncs succeeding"
          first_action: "Check the connector health state. A failed connector must not produce a reconciliation that looks complete."
          runbook: ""
      - alert: ai_schema_failures
        expr: ai_schema_validation_failure > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Has a model or prompt version started returning invalid output?"
          threshold: "more than 10 rejected AI responses in a window"
          first_action: "Nothing is financially broken: rejected responses change no state. Check whether the provider changed the model behind the endpoint."
          runbook: ""
      - alert: high_value_unmatched
        expr: high_value_unmatched_count > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Is material money unaccounted for?"
          threshold: "any unmatched item at or above materiality"
          first_action: "Route to the controller who owns the reconciliation."
          runbook: ""
      - alert: exception_backlog
        expr: exception_aging > 30
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Is the exception queue being worked?"
          threshold: "an open exception older than 30 days"
          first_action: "Escalate to the controller and check owner assignment."
          runbook: ""
      - alert: reopened_reconciliations
        expr: reopened_reconciliations > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Was something signed off that should not have been?"
          threshold: "any reconciliation reopened after closing"
          first_action: "Read the reopen reason. A pattern of reopenings means the close gate is too weak, not that users are careless."
          runbook: ""
